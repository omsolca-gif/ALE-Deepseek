<style>
:root {
  --bg: #0A192F; --bg2: #112240; --card: #172A45; --card-hover: #1E3557;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); min-height: 100vh; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; margin: 0; }
p { margin: 0 0 12px 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.hidden { display: none !important; }

header { position: sticky; top: 0; z-index: 50; background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }

.tab { flex: none; padding: 8px 16px; border-radius: 20px; background: var(--bg2); color: var(--mute); font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--border); }
.tab.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.card.link { display: block; transition: transform 0.2s; }
.card.link:active { transform: scale(0.98); }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--gold); color: var(--bg); padding: 12px 20px; border-radius: 6px; font-weight: 600; font-size: 14px; }

.opt { display: block; width: 100%; text-align: left; background: var(--bg2); border: 1px solid var(--border); padding: 14px; border-radius: 8px; margin-bottom: 8px; color: var(--text); font-size: 14px; }
.opt.correct { background: rgba(74, 222, 128, 0.1); border-color: var(--ok); }
.opt.wrong { background: rgba(248, 113, 113, 0.1); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.tip { background: rgba(100, 255, 218, 0.05); border-left: 3px solid var(--teal); padding: 14px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 12px 0; }
.legal-text { font-family: var(--serif); font-size: 15.5px; line-height: 1.7; color: #ccd6f6; }
.search-bar { width: 100%; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 16px; }

.say { display: flex; flex: 1 1 30%; align-items: center; justify-content: center; gap: 4px; background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 8px 4px; border-radius: 6px; font-size: 10px; font-weight: 600; transition: background 0.2s; }

.say.f2 { background: rgba(244, 228, 188, 0.1); color: #F4E4BC; }

const VOICES = {
  f1: { id: "af_bella", name: "Bella" },

let ttsModel = null;

window.speakKokoro = async function(text, voiceKey, btnElement) {
  const originalText = btnElement.innerHTML;
  
  if (ttsModel) {
    try {
      btnElement.innerHTML = "🔊...";
      const audio = await ttsModel.generate(text, { voice: VOICES[voiceKey].id });
      const blob = new Blob([audio.toWav()], { type: "audio/wav" });
      const url = URL.createObjectURL(blob);
      new Audio(url).play();
      btnElement.innerHTML = originalText;
    } catch (e) {
      btnElement.innerHTML = originalText;
      alert("Error al reproducir.");
    }
    return;
  }

  btnElement.innerHTML = "⏳...";
  try {
    const module = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/dist/kokoro.web.js");
    ttsModel = await module.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8" });
    btnElement.innerHTML = originalText;
    window.speakKokoro(text, voiceKey, btnElement);
  } catch (e) {
    btnElement.innerHTML = originalText;
    alert("No se pudo descargar el modelo de IA. Intenta en WiFi.");
  }
};

window.shareTTSMaker = async function(text) {
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Legal English', text: text });
      setTimeout(() => window.open("https://ttsmaker.com/", "_blank"), 500);
    } else {
      await navigator.clipboard.writeText(text);
      alert("Texto copiado. Se abrirá TTSMaker.");
      window.open("https://ttsmaker.com/", "_blank");
    }
  } catch (err) { console.warn(err); }
};

const LESSONS = [
  {
    id: "m1", title: "Módulo 1: Fundamentos del Common Law", weeks: [
      { w: 1, t: "Federalism & Sources of Law", 
        content: "<p>El sistema legal de EE. UU. no es único; coexisten 50 sistemas estatales y uno federal. La <i>U.S. Constitution</i> es la ley suprema, pero el derecho contractual es materia estatal. El <b>UCC (Uniform Commercial Code)</b> regula la venta de bienes muebles (<i>goods</i>).</p><div class='tip'><b>Diferencia con Costa Rica:</b> En CR, el Código Civil regula todo. En EE. UU., debes verificar si aplica el UCC (bienes) o el Common Law (servicios).</div>",
        audio: "The U.S. legal system is a dual system of federal and state law. The Uniform Commercial Code regulates the sale of goods."
      },
      { w: 2, t: "Court Structure & Jurisdiction", 
        content: "<p>El sistema federal tiene tres niveles: <b>District Courts</b> (primera instancia), <b>Courts of Appeals</b> (apelaciones) y <b>Supreme Court</b>.</p><p>Para demandar en corte federal, necesitas <b>Subject-Matter Jurisdiction</b>: <br>1. <b>Federal Question:</b> Caso basado en la Constitución o leyes federales.<br>2. <b>Diversity Jurisdiction:</b> Partes de distintos estados y disputa > $75,000 USD.</p>",
        audio: "Federal courts have limited jurisdiction. They hear cases involving federal questions or diversity of citizenship."
      },
      { w: 3, t: "Stare Decisis & Precedent", 
        content: "<p>El <b>Stare Decisis</b> obliga a los jueces a seguir los precedentes de tribunales superiores. La <b>Ratio Decidendi</b> (razón central) es vinculante; el <b>Obiter Dictum</b> (comentario al margen) no lo es.</p>",
        audio: "Stare decisis is the legal principle of determining points in litigation according to precedent."
      },
      { w: 4, t: "Contract Formation", 
        content: "<p>Un contrato en Common Law requiere: <b>Offer</b>, <b>Acceptance</b>, <b>Consideration</b> e <b>Intention to create legal relations</b>. Sin <i>consideration</i> (intercambio de valor), no hay contrato exigible (salvo que sea un <i>Deed</i>).</p>",
        audio: "A valid contract requires an offer, acceptance, and consideration."
      }
    ]
  },
  {
    id: "m2", title: "Módulo 2: Redacción Contractual I", weeks: [
      { w: 5, t: "Shall, May, Shall Not", 
        content: "<p><b>Shall:</b> Obligación. <i>\"The Seller shall deliver...\"</i><br><b>May:</b> Facultad. <i>\"The Buyer may terminate...\"</i><br><b>Shall not:</b> Prohibición. <i>\"The Company shall not assign...\"</i></p><div class='tip'>Nunca uses 'will' para crear obligaciones.</div>",
        audio: "The Seller shall deliver the goods. The Buyer may terminate the agreement. The Company shall not assign this contract."
      },
      { w: 6, t: "Conditions Precedent", 
        content: "<p>Una <b>condición precedente</b> es un evento que debe ocurrir antes de que una obligación sea exigible. Se usa <i>Subject to...</i> o <i>Provided that...</i>.</p>",
        audio: "The Buyer's obligation to close is subject to the receipt of regulatory approval."
      },
      { w: 7, t: "Representations & Warranties", 
        content: "<p><b>Representation:</b> Declaración de hechos pasados/presentes.<br><b>Warranty:</b> Promesa de que un hecho es verdadero.<br><b>Covenant:</b> Promesa de conducta futura.</p>",
        audio: "The Seller represents and warrants that the Company is duly organized and validly existing."
      },
      { w: 8, t: "Knowledge Qualifiers", 
        content: "<p>Limita la garantía al conocimiento del vendedor: <i>\"To the Seller's Knowledge\"</i>. Como abogado del comprador, negocia añadir <i>\"after reasonable inquiry\"</i>.</p>",
        audio: "To the Seller's knowledge, there is no pending litigation against the Company."
      }
    ]
  },
  {
    id: "m3", title: "Módulo 3: Redacción Contractual II", weeks: [
      { w: 9, t: "Indemnification", 
        content: "<p><b>Indemnify:</b> Reembolsar pérdidas.<br><b>Defend:</b> Asumir la defensa legal.<br><b>Hold Harmless:</b> Mantener libre de responsabilidad.</p>",
        audio: "Supplier shall indemnify, defend, and hold harmless Customer from any third-party claims."
      },
      { w: 10, t: "Limitation of Liability", 
        content: "<p>Exclusión de daños indirectos + <b>Cap</b> + <b>Carve-outs</b> (excepciones para dolo o confidencialidad).</p>",
        audio: "Neither party shall be liable for indirect or consequential damages. Total liability shall not exceed the fees paid."
      },
      { w: 11, t: "Liquidated Damages", 
        content: "<p>Suma pactada de antemano por incumplimiento. No puede ser una <i>penalty</i> (sanción), debe ser una estimación razonable del daño.</p>",
        audio: "Liquidated damages must be a reasonable estimate of anticipated harm and not a penalty."
      },
      { w: 12, t: "Boilerplate Clauses", 
        content: "<p><b>Severability:</b> Salva el contrato si una cláusula es nula.<br><b>Entire Agreement:</b> Excluye acuerdos previos.<br><b>Waiver:</b> Renuncia a derechos.</p>",
        audio: "If any provision is held invalid, the remaining provisions shall continue in full force and effect."
      }
    ]
  }
  // ... (Puedes añadir los módulos 4 al 12 siguiendo esta misma estructura)
];

let currentTab = 'lessons';
let state = {
  xp: parseInt(localStorage.getItem('xp') || '0'),

function updateXP(amount) {
  state.xp += amount;
  localStorage.setItem('xp', state.xp);
  document.getElementById('xp-display').innerText = state.xp + ' XP';
}

window.switchTab = function(tabName, btn) {
  currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
};

window.toggleAccordion = function(el) {
  const body = el.nextElementSibling;

};
