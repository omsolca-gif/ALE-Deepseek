<style>
:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); min-height: 100vh; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; margin: 0; }
p { margin: 0 0 12px 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.hidden { display: none !important; }

header { position: sticky; top: 0; z-index: 50; background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: var(--serif); font-size: 19px; color: var(--gold); letter-spacing: 0.5px; }
main { padding: 24px 20px 100px; max-width: 820px; margin: 0 auto; }
nav.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(17, 34, 64, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 50; }
.dock a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--mute); transition: color 0.2s; }
.dock a.active { color: var(--gold); }
.dock svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; display: block; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.card.link { display: block; transition: transform 0.2s; }
.card.link:active { transform: scale(0.98); }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--gold); color: var(--bg); padding: 12px 20px; border-radius: 6px; font-weight: 600; font-size: 14px; }

.hero h1 { font-size: 32px; color: var(--gold-light); margin-bottom: 10px; line-height: 1.1; }
.hero p { color: var(--mute); font-size: 14px; max-width: 500px; margin: 0 auto 16px; }
.list-item { display: flex; align-items: center; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
.list-item .num { font-family: var(--serif); font-size: 18px; color: var(--mute); width: 36px; }
.list-item .content { flex: 1; }
.list-item h4 { font-size: 15px; margin-bottom: 3px; color: var(--text); }
.list-item p { font-size: 12px; color: var(--mute); margin: 0; }
.list-item .arrow { color: var(--gold); font-size: 18px; }
.opt { display: block; width: 100%; text-align: left; background: var(--bg2); border: 1px solid var(--border); padding: 14px; border-radius: 8px; margin-bottom: 8px; color: var(--text); font-size: 14px; }
.opt.correct { background: rgba(74, 222, 128, 0.1); border-color: var(--ok); }
.opt.wrong { background: rgba(248, 113, 113, 0.1); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.tip { background: rgba(100, 255, 218, 0.05); border-left: 3px solid var(--teal); padding: 14px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 12px 0; }
.legal-text { font-family: var(--serif); font-size: 15.5px; line-height: 1.7; color: #ccd6f6; }
.search-bar { width: 100%; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 16px; }

.audio-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.say { display: flex; flex: 1 1 45%; align-items: center; justify-content: center; gap: 5px; background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 9px 6px; border-radius: 8px; font-size: 11px; font-weight: 600; transition: background 0.2s; }
.say:active { background: rgba(212, 175, 55, 0.2); }
.say.f1 { background: rgba(212, 175, 55, 0.15); color: #D4AF37; }
.say.f2 { background: rgba(244, 228, 188, 0.1); color: #F4E4BC; }
.say.m1 { background: rgba(100, 255, 218, 0.1); color: #64FFDA; }
.say.m2 { background: rgba(100, 255, 218, 0.15); color: #88FFF0; }
.say.tts { background: rgba(255, 255, 255, 0.05); color: #E6F1FF; }

.timeline { display: flex; flex-direction: column; gap: 12px; }
.month-block { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.month-header { background: var(--bg2); padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.month-header h3 { font-size: 16px; color: var(--gold-light); margin: 0; }
.month-body { padding: 0 18px 14px; display: none; }
.month-body.open { display: block; }
.week-row { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.week-row:last-child { border-bottom: none; }
.week-row span { font-size: 13px; color: var(--mute); }
.week-row a { font-size: 12px; color: var(--gold); font-weight: 600; }
</style>
</head>

let state = {
  xp: parseInt(localStorage.getItem('xp') || '0'),
  completed: JSON.parse(localStorage.getItem('completed') || '[]'),
};

function updateXP(amount) {
  state.xp += amount;
  localStorage.setItem('xp', state.xp);
  document.getElementById('xp-display').innerText = state.xp + ' XP';
}

function markCompleted(id) {
  if (!state.completed.includes(id)) {
    state.completed.push(id);
    localStorage.setItem('completed', JSON.stringify(state.completed));
    updateXP(20);
  }
}

let ttsModel = null;
const VOICES = {
  f1: "af_bella",
  f2: "af_nicole",
  m1: "am_adam",
  m2: "am_michael"
};

window.speakKokoro = async function(text, voiceId, btnElement) {
  const originalText = btnElement.innerHTML;
  
  if (ttsModel) {
    try {
      btnElement.innerHTML = "🔊...";
      const audio = await ttsModel.generate(text, { voice: voiceId });
      const blob = new Blob([audio.toWav()], { type: "audio/wav" });
      const url = URL.createObjectURL(blob);
      new Audio(url).play();
      btnElement.innerHTML = originalText;
    } catch (e) {
      btnElement.innerHTML = originalText;
      alert("Error al reproducir. Intenta con TTSMaker.");
    }
    return;
  }

  btnElement.innerHTML = "⏳...";
  btnElement.style.opacity = "0.7";
  
  try {
    const module = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/dist/kokoro.web.js");
    ttsModel = await module.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8" });
    btnElement.innerHTML = originalText;
    btnElement.style.opacity = "1";
    window.speakKokoro(text, voiceId, btnElement);
  } catch (e) {
    btnElement.innerHTML = originalText;
    btnElement.style.opacity = "1";
    alert("No se pudo descargar el modelo de IA (80MB). Usa TTSMaker o intenta en WiFi.");
  }
};

window.shareTTSMaker = async function(text) {
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Legal English', text: text });
      setTimeout(() => window.open("https://ttsmaker.com/", "_blank"), 500);
    } else {
      await navigator.clipboard.writeText(text);
      alert("Texto copiado. Se abrirá TTSMaker para generar el audio.");
      window.open("https://ttsmaker.com/", "_blank");
    }
  } catch (err) { console.warn(err); }
};

      <input type="text" class="search-bar" placeholder="Buscar término..." onkeyup="filterDict(this.value)">
      ${areas.map(area => `
        <h4 style="color:var(--teal);margin:16px 0 8px;font-size:13px;">${area}</h4>
        <div class="dict-area" data-area="${area}">
          ${DICTIONARY.filter(d => d.area === area).map(d => `
            <div class="card dict-item" style="padding:14px;">
              <h4 style="color:var(--gold-light);font-size:15px;">${d.t}</h4>
              <p style="font-size:12px;color:var(--text);margin:4px 0;"><b>${d.es}</b> — ${d.def}</p>
              <div class="audio-controls" style="margin-top:6px;">
                <button class="say f1" style="padding:6px;font-size:10px;" onclick="speakKokoro('${d.t}', 'af_bella', this)">F1</button>
                <button class="say m1" style="padding:6px;font-size:10px;" onclick="speakKokoro('${d.t}', 'am_adam', this)">M1</button>
                <button class="say tts" style="padding:6px;font-size:10px;" onclick="shareTTSMaker('${d.t}')">☁️</button>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    `;
  }
  window.scrollTo(0,0);
}

window.filterDict = function(query) {
  const items = document.querySelectorAll('.dict-item');
  query = query.toLowerCase();
  items.forEach(item => {
    const text = item.innerText.toLowerCase();
    item.style.display = text.includes(query) ? 'block' : 'none';
  });
};

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('xp-display').innerText = state.xp + ' XP';
  router();
});
</script>
</body>
</html>
