<title>Legal English · Voice Lab Pro</title>
<style>
:root{--bg:#0b1522;--bg2:#101e30;--card:#12233a;--card2:#16293f;--line:#22384f;--line2:#2d4763;--gold:#af915f;--gold2:#e2c98a;--cream:#fce1b6;--text:#f3f5f8;--mute:#9db0c4;--dim:#6d8299;--ok:#54b78e;--bad:#e07070;--serif:Georgia,serif;--sans:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);min-height:100dvh}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(175,145,95,.07),transparent 60%),radial-gradient(900px 400px at -10% 20%,rgba(45,90,140,.10),transparent 55%),var(--bg)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:rgba(11,21,34,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font:400 19px/1.2 var(--serif);letter-spacing:.04em;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;color:var(--gold);font-size:30px;line-height:1;padding:0 6px;cursor:pointer}
.pill{background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:7px 16px;font-weight:600;font-size:13px;cursor:pointer}
.pill:hover{background:var(--gold);color:var(--bg)}
main{padding:20px 16px calc(104px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold2);color:#0b1522;padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.dock{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(9,17,28,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.dock a{flex:1;max-width:130px;text-align:center;color:var(--mute);text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:9px 2px 8px}
.dock a svg{display:block;width:22px;height:22px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock a.on{color:var(--gold2)}
h2,h3{font-family:var(--serif);font-weight:400}
h2{font-size:24px;line-height:1.25;margin:4px 0 10px}
h3{margin:0 0 4px;font-size:17.5px}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.mute{color:var(--mute);font-size:14px}
.dim{color:var(--dim);font-size:12.5px}
.legal{font-family:var(--serif);font-size:16.5px;line-height:1.6}
q{color:var(--cream);font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
a.card{display:block;color:inherit;text-decoration:none}
.hero{background:linear-gradient(165deg,#1a3050,#0e1e33 55%,#0b1522);border:1px solid var(--line2);border-radius:20px;padding:26px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"§";position:absolute;right:6px;bottom:-46px;font:400 170px var(--serif);color:rgba(175,145,95,.09);pointer-events:none}
.hero h2{font-size:27px;margin:6px 0 10px}
.bar{height:6px;background:#0a1726;border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px}
.ring{width:88px;height:88px;flex:none}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:#1c3249}.ring .fgc{stroke:var(--gold2)}
.ring text{fill:var(--cream);font:600 19px var(--sans)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font:400 24px var(--serif);color:var(--cream)}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.btn{display:block;width:100%;background:var(--gold);color:#0b1522;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15.5px;margin-top:12px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.btnrow{display:flex;gap:10px}.btnrow .btn{margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;color:var(--mute);white-space:nowrap}
.done{color:var(--ok);font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 44px;margin:8px 0;font-size:15px;cursor:pointer;position:relative}
.opt::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:1px solid var(--line2);border-radius:7px;display:grid;place-items:center;font:600 11px var(--sans);color:var(--mute)}
.opt.ok{border-color:var(--ok);background:rgba(84,183,142,.12)}
.opt.bad{border-color:var(--bad);background:rgba(224,112,112,.1)}
.tip{background:rgba(84,183,142,.08);border:1px solid rgba(84,183,142,.25);padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.say{background:none;border:1px solid var(--line2);color:var(--gold2);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.say svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b3050;border:1px solid var(--gold);color:var(--cream);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.listlink{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.listlink .num{font:400 20px var(--serif);color:var(--gold);width:30px;text-align:center;flex:none}
.listlink .grow{flex:1;min-width:0}
.listlink .arr{color:var(--dim);font-size:18px}
.seg{display:flex;background:#081320;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 4px;border-radius:9px;font-weight:600;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--bg)}
.flip{perspective:1200px;height:280px;margin-bottom:12px;cursor:pointer}
.flip .in{position:relative;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:20px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2)}
.face.back{transform:rotateY(180deg)}
.face .big{font:400 36px var(--serif);color:var(--cream)}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.gitem h4{margin:0;font:400 17px var(--serif);color:var(--cream);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gitem .cat{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.gitem p{margin:6px 0 0;font-size:13.5px;color:var(--mute)}
.gitem .es{color:var(--gold2);font-weight:600}
@media(min-width:680px){.hero h2{font-size:32px}main{padding-top:28px}}
</style>
</head>

<script>
window.COURSE = {modules:[],falseFriends:[],redlines:[],glossary:[],phrases:[]};
const M = window.COURSE.modules;
const mk = (id,title,es,level,hours,lessons,quiz,dialogues=[]) => ({id,title,es,level,hours,lessons,quiz,dialogues});

M.push(mk("m1","The American Legal System","Sistema jurídico de EE. UU.","B1–B2",8,[
  {t:"Federalism & sources of law",body:`<p>EE. UU. tiene <b>dos sistemas paralelos</b>: federal y estatal. La <b>Constitution</b> es suprema; debajo: <b>statutes</b>, <b>regulations</b> y <b>case law</b>. El <b>UCC</b> regula venta de bienes.</p><p class="tip">No existe un Código Civil uniforme; Luisiana es la excepción civilista.</p>`},
  {t:"Court system & jurisdiction",body:`<p><b>District Courts</b> → <b>Courts of Appeals</b> → <b>Supreme Court</b>. Competencia federal: <i>federal question</i> o <i>diversity jurisdiction</i> (>$75,000). <b>Venue</b> es el lugar geográfico.</p>`},
  {t:"Stare decisis & precedent",body:`<p><b>Stare decisis</b> obliga a seguir precedentes vinculantes. <b>Ratio decidendi</b> vs. <b>obiter dictum</b>.</p>`},
  {t:"Adversarial system & jury",body:`<p>Las partes impulsan la prueba. Estándares: <b>preponderance</b> (civil), <b>clear and convincing</b>, <b>beyond reasonable doubt</b> (penal).</p>`}
],[
  {q:"Contratos mercantiles en EE. UU. se rigen por…",o:["Derecho federal","Derecho estatal","Código Napoleón","Derecho internacional"],a:1,e:"Contract law es materia estatal."},
  {q:"“Stare decisis” significa…",o:["Cosa juzgada","Mantener lo decidido","Prescripción","Prueba plena"],a:1,e:"Obliga a seguir precedentes."},
  {q:"Un precedente de otra jurisdicción es…",o:["Binding authority","Persuasive authority","Ratio decidendi","Obiter dictum"],a:1,e:"Persuade pero no vincula."},
  {q:"Estándar probatorio civil típico:",o:["Beyond reasonable doubt","Preponderance of the evidence","Clear and convincing","Prueba de cargo"],a:1,e:">50% de probabilidad."}
],[{title:"Client intake — federal claim",lines:[["Attorney","Good morning. Can you tell me what happened?"],["Client","I was fired after reporting safety violations at a federal contractor."],["Attorney","That could be a federal whistleblower claim. We need to file in District Court."]]}]));

M.push(mk("m2","Contract Drafting Fundamentals","Redacción contractual","B2–C1",12,[
  {t:"Shall, may, must, will",body:`<p><b>Shall</b> = obligación; <b>may</b> = facultad; <b>must</b> = condición; <b>will</b> = intención futura. <b>Shall not</b> = prohibición.</p><p class="tip">Use <i>shall</i> solo si puede sustituirlo por “has a duty to”.</p>`},
  {t:"Anatomy of a contract",body:`<p>Title → Parties → Recitals → Definitions → Operative → Reps & Warranties → Covenants → Conditions → Indemnification → Termination → Boilerplate → Execution.</p>`},
  {t:"Conditions & logic",body:`<p><b>Condition precedent</b> suspende la obligación. <b>Subject to</b> = con sujeción a. <b>Provided that</b> = siempre que.</p>`},
  {t:"Numbers, dates & time",body:`<p>Escriba importes en letra y número. <b>Business days</b> vs. <b>calendar days</b>. Formato EE. UU.: <i>March 5, 2027</i>. <b>Time is of the essence</b>.</p>`}
],[
  {q:"¿Qué verbo crea obligación?",o:["may","shall","will","might"],a:1,e:"Shall impone un deber."},
  {q:"“The Licensee may sublicense” significa…",o:["debe","tiene prohibido","tiene la facultad","sublicenciará"],a:2,e:"May = facultad discrecional."},
  {q:"“Recitals” equivale a…",o:["Firmas","Considerandos","Definiciones","Penalidades"],a:1,e:"Exponen antecedentes."},
  {q:"“Subject to Section 8.2” significa…",o:["Sujeto a aprobación","Con sujeción a la cláusula 8.2","Eliminada","Objeto"],a:1,e:"Subordina la disposición."}
],[{title:"Negotiating a cap",lines:[["Buyer","We need an uncapped indemnity for IP infringement."],["Seller","We can accept a cap at 2x fees, with a carve-out for willful misconduct."],["Buyer","Agreed, but confidentiality breaches must be uncapped."]]}]));

M.push(mk("m3","Representations & Warranties","Declaraciones y garantías","C1",10,[
  {t:"Reps vs. Warranties vs. Covenants",body:`<p><b>Representation</b>: declaración de hechos pasados/presentes. <b>Warranty</b>: promesa de que un hecho es verdadero. <b>Covenant</b>: promesa de conducta futura.</p>`},
  {t:"Knowledge qualifiers",body:`<p><b>To the Seller’s Knowledge</b> limita la garantía al conocimiento actual. <b>Materiality scrape</b> ignora calificadores de materialidad al calcular daños.</p>`},
  {t:"Survival & fundamental reps",body:`<p>Las reps sobreviven al cierre por un plazo. Las <b>fundamental reps</b> sobreviven más o indefinidamente.</p>`}
],[
  {q:"Promesa sobre conducta futura es…",o:["Representation","Recital","Covenant","Counterpart"],a:2,e:"Covenant = compromiso."},
  {q:"“To the Seller’s Knowledge”…",o:["Hace ilimitada","Limita al conocimiento","Convierte en covenant","Elimina"],a:1,e:"Knowledge qualifier."}
],[{title:"Negotiating a knowledge qualifier",lines:[["Buyer","We want a flat warranty that there is no litigation."],["Seller","We can only warrant to our knowledge, after reasonable inquiry."]]}]));

M.push(mk("m4","Liability & Remedies","Responsabilidad y remedios","C1",10,[
  {t:"Damages",body:`<p><b>Compensatory</b>, <b>consequential</b>, <b>liquidated</b> (no penalty), <b>punitive</b>, <b>nominal</b>.</p>`},
  {t:"Limitation of liability",body:`<p>Exclusión de daños indirectos + <b>cap</b> + <b>carve-outs</b> (dolo, confidencialidad).</p>`},
  {t:"Indemnify, defend & hold harmless",body:`<p><b>Indemnify</b> = reembolsar; <b>defend</b> = asumir defensa; <b>hold harmless</b> = mantener indemne.</p>`}
],[
  {q:"“Liquidated damages” =",o:["Daños líquidos","Indemnización preestablecida","Daños punitivos","Costas"],a:1,e:"Suma pactada."},
  {q:"Un “cap” es…",o:["Excepción","Tope máximo","Seguro","Garantía"],a:1,e:"Límite cuantitativo."},
  {q:"“Carve-outs” son…",o:["Excepciones","Covenants","Recitals","Waivers"],a:0,e:"Excluyen supuestos."}
],[]));

M.push(mk("m5","Boilerplate & General Clauses","Cláusulas generales","B2–C1",8,[
  {t:"Entire agreement & severability",body:`<p><b>Entire Agreement</b> excluye acuerdos previos. <b>Severability</b> salva el resto si una cláusula es nula.</p>`},
  {t:"Governing law & jury waiver",body:`<p>Ley aplicable + foro + <b>waiver of jury trial</b>.</p>`},
  {t:"Force majeure & assignment",body:`<p>En Common Law la fuerza mayor no se presume: debe estar en el contrato.</p>`}
],[
  {q:"Cláusula de salvaguarda:",o:["Waiver","Severability","Assignment","Notices"],a:1,e:"Divisibilidad."},
  {q:"En Common Law, la fuerza mayor…",o:["Siempre aplica","Solo si el contrato la prevé","Es inconstitucional","Solo terremotos"],a:1,e:"Contractual."},
  {q:"“Exclusive jurisdiction”…",o:["Cualquier tribunal","Solo los designados","No hay tribunal","Arbitraje obligatorio"],a:1,e:"Cierra el foro."}
],[]));

M.push(mk("m6","M&A & Corporate Transactions","Fusiones y adquisiciones","C1",14,[
  {t:"Deal phases",body:`<p>NDA → LOI → Due diligence → SPA/APA → Signing → Conditions → Closing → Post-closing.</p>`},
  {t:"Share vs. Asset deal",body:`<p><b>Share deal</b>: compra acciones y hereda pasivos. <b>Asset deal</b>: elige activos y pasivos.</p>`},
  {t:"Price mechanisms",body:`<p><b>Escrow</b>, <b>earn-out</b>, <b>locked box</b>, <b>MAC/MAE</b>, <b>R&W insurance</b>.</p>`}
],[
  {q:"Un LOI generalmente es…",o:["Vinculante","No vinculante salvo cláusulas","Escritura","Sentencia"],a:1,e:"Non-binding."},
  {q:"Dinero con un tercero como garantía:",o:["Earn-out","Escrow","Proxy","Quorum"],a:1,e:"Escrow."},
  {q:"Derecho del minoritario a vender:",o:["Drag-along","Tag-along","Pre-emptive","Earn-out"],a:1,e:"Tag-along."}
],[{title:"Due diligence request",lines:[["Buyer","Please provide all material contracts and a schedule of pending litigation."],["Seller","We'll upload to the data room by Friday."]]}]));

M.push(mk("m7","U.S. Civil Litigation","Litigio civil","C1",12,[
  {t:"Pleadings",body:`<p><b>Complaint</b> → <b>Answer</b> o <b>Motion to dismiss</b> (12(b)(6)). <b>Service of process</b>.</p>`},
  {t:"Discovery",body:`<p><b>Interrogatories</b>, <b>RFPs</b>, <b>depositions</b>, <b>requests for admission</b>.</p>`},
  {t:"Motions & trial",body:`<p><b>Summary judgment</b>, <b>in limine</b>, <b>TRO</b>. Juicio: voir dire, opening, direct/cross, closing, verdict.</p>`}
],[
  {q:"Preguntas escritas bajo juramento:",o:["Depositions","Interrogatories","Requests for admission","Motions"],a:1,e:"Interrogatories."},
  {q:"“Motion to dismiss” por 12(b)(6)…",o:["Incompetencia","Falta de pretensión válida","Prueba ilegal","Jurado sesgado"],a:1,e:"Failure to state a claim."},
  {q:"“Dismissal with prejudice”…",o:["Puede reintentarse","No puede volver a presentarse","Hubo discriminación","Se cambió de sede"],a:1,e:"Cosa juzgada."}
],[]));

M.push(mk("m8","International Arbitration","Arbitraje internacional","C1–C2",10,[
  {t:"Arbitration clause",body:`<p>Institución, <b>seat</b>, número de árbitros, idioma, ley aplicable.</p>`},
  {t:"New York Convention 1958",body:`<p>Reconocimiento y ejecución de laudos extranjeros. <b>Kompetenz-kompetenz</b> y <b>separability</b>.</p>`},
  {t:"Emergency & costs",body:`<p><b>Emergency arbitrator</b>, <b>security for costs</b>. <b>Costs follow the event</b>.</p>`}
],[
  {q:"El “seat” determina…",o:["Hotel","Ley procesal y tribunales","Idioma","Honorarios"],a:1,e:"Lex arbitri."},
  {q:"“Award” significa…",o:["Premio","Laudo arbitral","Demanda","Prueba"],a:1,e:"Laudo."},
  {q:"Convención clave:",o:["Viena 1980","Nueva York 1958","La Haya 1965","Montevideo 1933"],a:1,e:"Nueva York 1958."}
],[]));

M.push(mk("m9","Intellectual Property & Licensing","Propiedad intelectual","C1",10,[
  {t:"Four pillars of IP",body:`<p><b>Patents</b> (20 años), <b>trademarks</b> (renovables), <b>copyright</b> (vida+70), <b>trade secrets</b>.</p>`},
  {t:"Work made for hire",body:`<p>En EE. UU. el empleador es autor inicial en ciertos casos. En Costa Rica el autor es siempre la persona física.</p>`},

async function speak(text, gender){
  gender = gender || "f";
  const model = await initTTS();
  if(!model){
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.92;
      speechSynthesis.speak(u);
    }
    return;
  }
  try{
    const voices = VOICES[gender] || VOICES.f;
    const voice = voices[Math.floor(Math.random()*voices.length)];
    const audio = await model.generate(text, { voice });
    const blob = new Blob([audio.toWav()], { type:"audio/wav" });
    const url = URL.createObjectURL(blob);
    const player = new Audio(url);
    player.play(); player.onended = () => URL.revokeObjectURL(url);
  }catch(e){
    console.warn(e); toast("Error de audio");
  }
}

}

function runQuiz(qs, title, back, onDone){
  shell(title, back.indexOf("module")===0?"modules":"practice", back);
  let i=0, ok=0;
  const draw = ()=>{
    if(i>=qs.length){ const p=Math.round((ok/qs.length)*100); onDone&&onDone(p); save();
      $("#view").innerHTML='<div class="card hero" style="text-align:center"><div class="eyebrow">Resultado</div><h2 style="font-size:44px;margin:8px 0">'+p+'%</h2><p class="mute">'+ok+' de '+qs.length+'</p></div><a class="btn" href="'+back+'">Volver</a>'; return; }
    const q = qs[i];
    $("#view").innerHTML = '<div class="row"><span class="mute">Pregunta '+(i+1)+' de '+qs.length+'</span><span class="tag">Correctas: '+ok+'</span></div><div class="bar"><i style="width:'+(i/qs.length)*100+'%"></i></div><div class="card"><h3 style="font-family:var(--sans);font-weight:600;font-size:16.5px">'+q.q+'</h3>'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'" data-l="'+["A","B","C","D"][k]+'">'+o+'</button>').join("")+'<div id="ex"></div></div>';
    $$(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, good=k===q.a;
      if(good) ok++; else if(!st.wrong.some(w=>w.q===q.q)) st.wrong.push(q);
      $$(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("ok"); });
      if(!good) b.classList.add("bad");
      $("#ex").innerHTML = '<p class="tip">'+(good?"✓ Correcto.":"✗ Incorrecto.")+' '+q.e+'</p><button class="btn" id="nx">'+(i+1<qs.length?"Siguiente":"Ver resultado")+'</button>';
      $("#nx").onclick=()=>{ i++; draw(); }; save();
    });
  }; draw();
}

function runQuizInline(qs, container){

  let i=0, ok=0;
  const draw = ()=>{
    if(i>=qs.length){ const p=Math.round((ok/qs.length)*100); addXP(Math.round(p/5),"lectura "+p+"%");
      container.innerHTML = '<h3>Resultado</h3><p class="mute">'+p+'% · '+ok+'/'+qs.length+'</p>'; return; }
    const q = qs[i];
    container.innerHTML = '<h3>Comprensión</h3><p class="mute">'+(i+1)+'/'+qs.length+'</p><h3 style="font-family:var(--sans);font-weight:600;font-size:16px">'+q.q+'</h3>'+q.o.map((o,k)=>'<button class="opt" data-k="'+k+'" data-l="'+["A","B","C","D"][k]+'">'+o+'</button>').join("")+'<div id="ex2"></div>';
    container.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, good=k===q.a;
      if(good) ok++;
      container.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("ok"); });
      if(!good) b.classList.add("bad");
      $("#ex2").innerHTML = '<p class="tip">'+(good?"✓":"✗")+' '+q.e+'</p><button class="btn" id="nx2">'+(i+1<qs.length?"Siguiente":"Ver resultado")+'</button>';
      $("#nx2").onclick=()=>{ i++; draw(); };
    });
  }; draw();
}

function shell(title, tab, back){
  $("#title").textContent = title;
  const b = $("#back"); b.hidden = !back;
  b.onclick = ()=> location.hash = back || "#/";
  $$(".dock a").forEach(a=>a.classList.toggle("on", a.dataset.tab===tab));
  window.scrollTo(0,0);
}
function ring(pct){ const r=38,c=2*Math.PI*r; return '<svg class="ring" viewBox="0 0 88 88"><circle class="bgc" cx="44" cy="44" r="'+r+'"/><circle class="fgc" cx="44" cy="44" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'" transform="rotate(-90 44 44)"/><text x="44" y="50" text-anchor="middle">'+pct+'%</text></svg>'; }

function route(){
  const parts = (location.hash||"#/").slice(1).split("/");
  const name = parts[0]||"", args = parts.slice(1);
  let page = name || "home";
  if(name==="practice" && args[0]) page = {quick:"quick",cards:"cards",redline:"redline",drills:"drills"}[args[0]] || "practice";
  if(page==="exam" && args[0]) page = "examDetail";
  const fn = pages[page] || pages.home;
  fn.apply(null, args);
}
addEventListener("hashchange", route); route();

let deferred;
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred=e; $("#install").hidden=false; });
$("#install").onclick = async ()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $("#install").hidden=true; };

if("serviceWorker" in navigator){
  const swCode = "const CACHE='legal-en-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])).then(()=>self.skipWaiting()));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});self.addEventListener('fetch',e=>{const req=e.request;if(req.method!=='GET')return;const url=new URL(req.url);if(url.origin===location.origin){e.respondWith(caches.match(req).then(hit=>hit||fetch(req).then(res=>{if(res.ok&&res.type==='basic'){const cp=res.clone();caches.open(CACHE).then(c=>c.put(req,cp));}return res;}).catch(()=>caches.match('./'))));}else if(/esm\\.sh|cdn\\.jsdelivr|huggingface\\.co/.test(url.hostname)){e.respondWith(fetch(req).then(res=>{if(res.ok){const cp=res.clone();caches.open(CACHE).then(c=>c.put(req,cp));}return res;}).catch(()=>caches.match(req)));}});";
  const blob = new Blob([swCode], {type:"application/javascript"});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(e=>console.warn("SW registration failed (normal on file:// and iOS):", e));
}
})();
