<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<title>Legal English · Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A192F; --bg2: #112240; --card: #172A45; --card-hover: #1E3557;
  --gold: #D4AF37; --gold-light: #F4E4BC; --teal: #64FFDA;
  --text: #E6F1FF; --mute: #8892B0; --border: #233554;
  --serif: 'Playfair Display', Georgia, serif; --sans: 'Inter', -apple-system, sans-serif;
  --ok: #4ADE80; --bad: #F87171;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); min-height: 100vh; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; margin: 0; }
p { margin: 0 0 12px 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.hidden { display: none !important; }

header { position: sticky; top: 0; z-index: 50; background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: var(--serif); font-size: 20px; color: var(--gold); letter-spacing: 0.5px; }
main { padding: 24px 20px 100px; max-width: 800px; margin: 0 auto; }
nav.dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(17, 34, 64, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
.dock a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--mute); transition: color 0.2s; }
.dock a.active { color: var(--gold); }
.dock svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; display: block; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card.link { display: block; transition: transform 0.2s; }
.card.link:active { transform: scale(0.98); }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--gold); color: var(--bg); padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 14px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(212, 175, 55, 0.15); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.3); }
.hero { text-align: center; padding: 30px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.hero h1 { font-size: 36px; color: var(--gold-light); margin-bottom: 12px; line-height: 1.1; }
.hero p { color: var(--mute); font-size: 15px; max-width: 500px; margin: 0 auto 20px; }
.list-item { display: flex; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
.list-item .num { font-family: var(--serif); font-size: 20px; color: var(--mute); width: 40px; }
.list-item .content { flex: 1; }
.list-item h4 { font-size: 16px; margin-bottom: 4px; color: var(--text); }
.list-item p { font-size: 13px; color: var(--mute); margin: 0; }
.list-item .arrow { color: var(--gold); font-size: 20px; }
.opt { display: block; width: 100%; text-align: left; background: var(--bg2); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 10px; color: var(--text); }
.opt.correct { background: rgba(74, 222, 128, 0.1); border-color: var(--ok); }
.opt.wrong { background: rgba(248, 113, 113, 0.1); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.flip-card { perspective: 1000px; height: 220px; margin-bottom: 16px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
.flip-back { transform: rotateY(180deg); background: var(--bg2); border-color: var(--gold); }
.tip { background: rgba(100, 255, 218, 0.05); border-left: 3px solid var(--teal); padding: 16px; border-radius: 0 8px 8px 0; font-size: 14px; margin: 16px 0; }
.legal-text { font-family: var(--serif); font-size: 16px; line-height: 1.7; color: #ccd6f6; }
.say { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; width: 100%; margin-top: 10px; }
.say:active { background: rgba(212, 175, 55, 0.2); }
.search-bar { width: 100%; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo">Legal English · Pro</div>
  <div style="color:var(--gold);font-weight:600;font-size:14px" id="xp-display">0 XP</div>
</header>

<main id="app"></main>

<nav class="dock">
  <a href="#/" id="nav-home" class="active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</a>
  <a href="#/modules" id="nav-modules"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Módulos</a>
  <a href="#/lab" id="nav-lab"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>Voice Lab</a>
  <a href="#/practice" id="nav-practice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Práctica</a>
</nav>

<script>
const DATA = {
  glossary: [
    { t: "Consideration", es: "Contraprestación", d: "Requisito del Common Law: un intercambio de valor mutuo." },
    { t: "Estoppel", es: "Doctrina de los actos propios", d: "Imposibilidad de alegar algo contrario a la propia conducta previa." },
    { t: "Fiduciary Duty", es: "Deber fiduciario", d: "Obligación de lealtad y cuidado." },
    { t: "Tort", es: "Responsabilidad extracontractual", d: "Daño civil que no deriva de un contrato." },
    { t: "Specific Performance", es: "Cumplimiento forzoso", d: "El tribunal obliga a cumplir lo pactado." },
    { t: "Escrow", es: "Depósito en garantía", d: "Fondos retenidos por un tercero." },
    { t: "Warranty", es: "Garantía contractual", d: "Promesa de que un hecho es verdadero." },
    { t: "Indemnity", es: "Indemnidad", d: "Reembolsar pérdidas o defender a la otra parte." }
  ],
  falseFriends: [
    { en: "Actionable", wrong: "Accionable", right: "Que da base a una demanda", ex: "The statement is actionable." },
    { en: "Consideration", wrong: "Consideración (amabilidad)", right: "Contraprestación", ex: "Without consideration, it's a gift." },
    { en: "Execute", wrong: "Ejecutar (matar)", right: "Firmar un documento", ex: "The lease was executed yesterday." },
    { en: "Damages", wrong: "Daños físicos", right: "Indemnización económica", ex: "The court awarded $50,000 in damages." },
    { en: "Attorney", wrong: "Apoderado", right: "Abogado", ex: "I need to consult my attorney." },
    { en: "Sentence", wrong: "Sentencia civil", right: "Pena penal", ex: "He received a 5-year sentence." }
  ],
  modules: [
    {
      id: "m1", title: "The American Legal System", es: "Sistema Jurídico", level: "B1-B2", hours: 8,
      lessons: [
        { t: "Federalism", body: "<p>EE. UU. tiene un sistema dual: 50 estados y 1 federal. El derecho contractual es <b>estatal</b>. El UCC regula venta de bienes.</p>" },
        { t: "Court System", body: "<p>Federal: District Courts → Courts of Appeals → Supreme Court. Necesitas <i>Diversity Jurisdiction</i> (>$75,000) o <i>Federal Question</i>.</p>" }
      ],
      quiz: [
        { q: "¿Quién regula los contratos en EE. UU.?", o: ["Federal", "Estatal", "Napoleónico", "ONU"], a: 1, e: "Es materia estatal." },
        { q: "¿Qué es Stare Decisis?", o: ["Cosa juzgada", "Seguir precedentes", "Prescripción", "Apelación"], a: 1, e: "Obligación de seguir fallos anteriores." }
      ]
    },
    {
      id: "m2", title: "Contract Drafting", es: "Redacción Contractual", level: "B2-C1", hours: 12,
      lessons: [
        { t: "Shall vs May", body: "<p><b>Shall</b> = Obligación. <b>May</b> = Facultad. <b>Shall not</b> = Prohibición.</p><div class='tip'>Nunca uses 'will' para obligaciones.</div>" }
      ],
      quiz: [
        { q: "¿Qué verbo prohíbe?", o: ["May", "Will", "Shall not"], a: 2, e: "Shall not es prohibición." }
      ]
    }
  ]
};

let state = {
  xp: parseInt(localStorage.getItem('xp') || '0'),
  completed: JSON.parse(localStorage.getItem('completed') || '[]'),
};

function updateXP(amount) {
  state.xp += amount;
  localStorage.setItem('xp', state.xp);
  document.getElementById('xp-display').innerText = state.xp + ' XP';
}

function markCompleted(id) {
  if (!state.completed.includes(id)) {
    state.completed.push(id);
    localStorage.setItem('completed', JSON.stringify(state.completed));
    updateXP(50);
  }
}

// LÓGICA DE VOZ IA (Carga dinámica para no bloquear la app)
let ttsModel = null;
window.speakAI = async function(text) {
  if (!ttsModel) {
    alert("Iniciando voces IA... Esto tomará unos segundos la primera vez (descargando 80MB). Por favor, espera y vuelve a tocar el botón.");
    try {
      const module = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.0/dist/kokoro.web.js");
      ttsModel = await module.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8" });
      alert("¡Voces listas! Toca el botón de nuevo para escuchar.");
    } catch (e) {
      alert("Error al cargar IA. Revisa tu conexión WiFi.");
      console.error(e);
    }
    return;
  }
  
  try {
    const audio = await ttsModel.generate(text, { voice: "af_bella" });
    const blob = new Blob([audio.toWav()], { type: "audio/wav" });
    const url = URL.createObjectURL(blob);
    new Audio(url).play();
  } catch (e) {
    console.error(e);
  }
};

function router() {
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');
  document.querySelectorAll('.dock a').forEach(a => a.classList.remove('active'));
  
  if (hash === '#/' || hash === '') {
    document.getElementById('nav-home').classList.add('active');
    app.innerHTML = `
      <div class="hero">
        <span class="eyebrow">Master Edition</span>
        <h1>Legal English</h1>
        <p>Domina el sistema del Common Law.</p>
        <div class="badge">${state.completed.length} Módulos Completados</div>
      </div>
      ${DATA.modules.map(m => `
        <a href="#/module/${m.id}" class="card link">
          <span class="eyebrow">${m.level}</span>
          <h4 style="font-size:20px;margin:4px 0;">${m.title}</h4>
          <p style="color:var(--mute);font-size:14px;margin:0;">${m.es}</p>
        </a>
      `).join('')}
    `;
  } 
  else if (hash.startsWith('#/module/')) {
    const id = hash.split('/')[2];
    const mod = DATA.modules.find(m => m.id === id);
    if (!mod) return location.hash = '#/';
    document.getElementById('nav-modules').classList.add('active');
    app.innerHTML = `
      <a href="#/" style="color:var(--mute);font-size:14px;">← Volver</a>
      <h2 style="margin:20px 0 10px;">${mod.title}</h2>
      ${mod.lessons.map(l => `
        <div class="card">
          <h4 style="color:var(--gold-light);margin-bottom:12px;">${l.t}</h4>
          <div class="legal-text">${l.body}</div>
          <button class="say" onclick="speakAI('${l.t}')">🎙️ Escuchar título (IA)</button>
        </div>
      `).join('')}
      <h3 style="margin:24px 0 16px;">Evaluación</h3>
      ${mod.quiz.map((q, qIndex) => `
        <div class="card">
          <p style="font-weight:600;margin-bottom:12px;">${q.q}</p>
          ${q.o.map((opt, oIndex) => `
            <button class="opt" onclick="checkAnswer(this, ${oIndex === q.a}, '${q.e}')">${opt}</button>
          `).join('')}
          <div class="tip hidden"></div>
        </div>
      `).join('')}
    `;
  }
  else if (hash === '#/lab') {
    document.getElementById('nav-lab').classList.add('active');
    app.innerHTML = `
      <div class="hero">
        <span class="eyebrow">Voice Lab</span>
        <h2>Pronunciación IA</h2>
        <p>Voces hiperrealistas con Kokoro.</p>
      </div>
      <div class="card">
        <h4 style="color:var(--teal);margin-bottom:12px;">Prueba el Audio</h4>
        <button class="say" onclick="speakAI('Welcome to the Legal English Voice Lab.')">▶ Probar Kokoro IA</button>
        <p style="font-size:12px;color:var(--mute);margin-top:12px;">La primera vez descargará el modelo (80MB).</p>
      </div>
    `;
  }
  else if (hash === '#/practice') {
    document.getElementById('nav-practice').classList.add('active');
    app.innerHTML = `
      <h2 style="margin-bottom:16px;">Práctica</h2>
      <a href="#/practice/ff" class="list-item"><div class="num">⇄</div><div class="content"><h4>Falsos Amigos</h4></div><div class="arrow">›</div></a>
    `;
  }
  else if (hash === '#/practice/ff') {
    app.innerHTML = `
      <a href="#/practice" style="color:var(--mute);font-size:14px;">← Volver</a>
      <h3 style="margin:20px 0;">Falsos Amigos</h3>
      ${DATA.falseFriends.map(f => `
        <div class="card" onclick="this.querySelector('.answer').classList.toggle('hidden')">
          <h4 style="color:var(--gold-light);">${f.en}</h4>
          <p style="color:var(--bad);text-decoration:line-through;margin:8px 0;">❌ ${f.wrong}</p>
          <div class="answer hidden">
            <p style="color:var(--ok);font-weight:600;">✅ ${f.right}</p>
            <p class="legal-text" style="font-size:14px;margin-top:8px;">"${f.ex}"</p>
          </div>
        </div>
      `).join('')}
    `;
  }
  window.scrollTo(0,0);
}

window.checkAnswer = function(btn, isCorrect, explanation) {
  const container = btn.parentElement;
  container.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const tip = container.querySelector('.tip');
  tip.classList.remove('hidden');
  if (isCorrect) {
    btn.classList.add('correct');
    tip.innerHTML = `<b>✅ Correcto.</b> ${explanation}`;
    updateXP(10);
  } else {
    btn.classList.add('wrong');
    tip.innerHTML = `<b>❌ Incorrecto.</b> ${explanation}`;
  }
};

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('xp-display').innerText = state.xp + ' XP';
  router();
});
</script>
</body>
</html>
